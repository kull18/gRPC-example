syntax = "proto3"; 
option go_package = "gRPC-example/proto;proto";

package prodcuts; 


service ProductService {
    rpc CreateProduct (ProductRequest) returns (ProductResponse); 
    rpc GetAllProducts (google.protobuf-empty) return (GetAllProductsResponse); 
}

message Produtct {
    int32 ID = 1;
    string name = 2; 
    float price = 3; 
}

message ProductRequest {
    string name = 1;
    float price = 2; 
}


message ProductResponse {
    bool success = 1; 
    string message = 2;
}

message ProductDeleteRequest {
    int32 ID = 1; 
}